<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin · KiranaManagement</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
<script>
  // Guard: only a logged-in SuperAdmin may view this page.
  const TOKEN = localStorage.getItem('kirana_token');
  if(!TOKEN || localStorage.getItem('kirana_role') !== 'SuperAdmin') location.href = 'login.html';
</script>
<nav class="navbar navbar-dark bg-dark">
  <div class="container"><span class="navbar-brand">🛒 Super Admin</span>
    <span><span class="text-white-50 me-3" id="who"></span>
    <button class="btn btn-sm btn-outline-light" onclick="logout()">Logout</button></span></div>
</nav>
<div class="container mt-3">
  <div class="card"><div class="card-body">
    <h5 class="card-title d-flex justify-content-between">Pending stores
      <button class="btn btn-sm btn-outline-secondary" onclick="load()">Refresh</button></h5>
    <div id="list" class="table-responsive"></div>
  </div></div>
</div>
<script>
document.getElementById('who').textContent = localStorage.getItem('kirana_name') || '';
function hdr(){ return { 'Content-Type':'application/json', 'X-Auth-Token': TOKEN }; }
function logout(){ localStorage.clear(); location.href='login.html'; }

async function api(path, method, body){
  const res = await fetch(path, { method: method||'GET', headers: hdr(), body: body?JSON.stringify(body):undefined });
  if(res.status === 401){ logout(); return; }
  const data = await res.json().catch(()=>null);
  if(!res.ok) throw (data && data.error) || ('HTTP '+res.status);
  return data;
}

async function load(){
  try{
    const list = await api('/api/stores/pending');
    if(!list || !list.length){ document.getElementById('list').innerHTML='<p class="text-muted">No pending stores.</p>'; return; }
    let h='<table class="table table-sm align-middle"><thead><tr><th>Store</th><th>Owner</th><th>Email</th><th>City</th><th>GSTIN</th><th></th></tr></thead><tbody>';
    list.forEach(s=>{ h += '<tr><td>'+s.name+'</td><td>'+s.ownerName+'</td><td>'+s.email+'</td><td>'+(s.city||'')+'</td><td>'+(s.gstin||'')+
      '</td><td><button class="btn btn-sm btn-success me-1" onclick="approve(\''+s.id+'\')">Approve</button>'+
      '<button class="btn btn-sm btn-outline-danger" onclick="reject(\''+s.id+'\')">Reject</button></td></tr>'; });
    document.getElementById('list').innerHTML = h+'</tbody></table>';
  }catch(e){ document.getElementById('list').innerHTML='<div class="alert alert-danger py-2">'+e+'</div>'; }
}
async function approve(id){ try{ await api('/api/stores/'+id+'/approve','POST'); load(); }catch(e){ alert(e); } }
async function reject(id){
  const reason = prompt('Reason for rejection?');
  if(!reason) return;
  try{ await api('/api/stores/'+id+'/reject','POST',{ reason:reason }); load(); }catch(e){ alert(e); }
}
load();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Store · KiranaManagement</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
<script>
  // Guard: only a logged-in store Owner/Manager may view this page.
  const TOKEN = localStorage.getItem('kirana_token');
  const ROLE = localStorage.getItem('kirana_role');
  if(!TOKEN || (ROLE !== 'Owner' && ROLE !== 'Manager')) location.href = 'login.html';
</script>
<nav class="navbar navbar-dark bg-success">
  <div class="container"><span class="navbar-brand">🛒 My Store</span>
    <span><span class="text-white-50 me-3" id="who"></span>
    <button class="btn btn-sm btn-outline-light" onclick="logout()">Logout</button></span></div>
</nav>
<div class="container mt-3">
  <div class="card"><div class="card-body">
    <h5 class="card-title">Add a product (with variants)</h5>
    <div class="row g-2">
      <div class="col-md-6"><input id="p-name" class="form-control" placeholder="Product name"></div>
      <div class="col-md-6"><input id="p-brand" class="form-control" placeholder="Brand (optional)"></div>
      <div class="col-md-12"><input id="p-desc" class="form-control" placeholder="Description (optional)"></div>
    </div>
    <h6 class="mt-3">Variants</h6>
    <div id="variants"></div>
    <button class="btn btn-sm btn-outline-primary mt-2" onclick="addVariantRow()">+ Add variant</button>
    <div><button class="btn btn-success mt-3" onclick="createProduct()">Save product</button></div>
    <div id="p-out" class="mt-2"></div>
    <hr>
    <h5 class="card-title d-flex justify-content-between">My products
      <button class="btn btn-sm btn-outline-secondary" onclick="loadProducts()">Refresh</button></h5>
    <div id="product-list"></div>
  </div></div>
</div>
<script>
document.getElementById('who').textContent = localStorage.getItem('kirana_name') || '';
function hdr(){ return { 'Content-Type':'application/json', 'X-Auth-Token': TOKEN }; }
function logout(){ localStorage.clear(); location.href='login.html'; }
function v(id){ return document.getElementById(id).value.trim(); }

async function api(path, method, body){
  const res = await fetch(path, { method: method||'GET', headers: hdr(), body: body?JSON.stringify(body):undefined });
  if(res.status === 401){ logout(); return; }
  const data = await res.json().catch(()=>null);
  if(!res.ok) throw (data && data.error) || ('HTTP '+res.status);
  return data;
}

function addVariantRow(){
  const d = document.createElement('div');
  d.className='row g-1 mb-1 variant-row';
  d.innerHTML =
    '<div class="col"><input class="form-control form-control-sm v-name" placeholder="Name e.g. 1 kg"></div>'+
    '<div class="col"><input class="form-control form-control-sm v-sku" placeholder="SKU"></div>'+
    '<div class="col"><input type="number" class="form-control form-control-sm v-mrp" placeholder="MRP"></div>'+
    '<div class="col"><input type="number" class="form-control form-control-sm v-sell" placeholder="Selling"></div>'+
    '<div class="col"><input type="number" class="form-control form-control-sm v-tax" placeholder="Tax %"></div>'+
    '<div class="col"><input type="number" class="form-control form-control-sm v-stock" placeholder="Stock"></div>';
  document.getElementById('variants').appendChild(d);
}

async function createProduct(){
  const out = document.getElementById('p-out');
  try{
    const rows = Array.from(document.querySelectorAll('.variant-row')).map(r=>({
      name: r.querySelector('.v-name').value, sku: r.querySelector('.v-sku').value,
      unit: 0, packSize: 1,
      mrp: parseFloat(r.querySelector('.v-mrp').value)||0,
      sellingPrice: parseFloat(r.querySelector('.v-sell').value)||0,
      taxRatePercent: parseFloat(r.querySelector('.v-tax').value)||0,
      stockQuantity: parseInt(r.querySelector('.v-stock').value)||0, reorderLevel: 0
    }));
    if(!rows.length){ out.innerHTML='<div class="alert alert-danger py-2 mb-0">Add at least one variant.</div>'; return; }
    const p = await api('/api/products','POST',{ name:v('p-name'), brand:v('p-brand'), description:v('p-desc'), variants: rows });
    out.innerHTML = '<div class="alert alert-success py-2 mb-0">Saved <b>'+p.name+'</b> with '+p.variants.length+' variant(s).</div>';
    loadProducts();
  }catch(e){ out.innerHTML='<div class="alert alert-danger py-2 mb-0">'+e+'</div>'; }
}

async function loadProducts(){
  try{
    const list = await api('/api/products');
    if(!list || !list.length){ document.getElementById('product-list').innerHTML='<p class="text-muted">No products yet.</p>'; return; }
    let h='';
    list.forEach(p=>{
      h += '<div class="border rounded p-2 mb-2"><strong>'+p.name+'</strong> '+(p.brand?('· '+p.brand):'')+
        '<table class="table table-sm mt-2 mb-0"><thead><tr><th>Variant</th><th>MRP</th><th>Selling</th><th>Discount</th><th>Stock</th></tr></thead><tbody>';
      p.variants.forEach(x=>{ h += '<tr><td>'+x.name+'</td><td>₹'+x.mrp+'</td><td>₹'+x.sellingPrice+
        '</td><td>₹'+x.discountAmount+' ('+x.discountPercent+'%)</td><td>'+x.stockQuantity+'</td></tr>'; });
      h += '</tbody></table></div>';
    });
    document.getElementById('product-list').innerHTML = h;
  }catch(e){ document.getElementById('product-list').innerHTML='<div class="alert alert-danger py-2">'+e+'</div>'; }
}

addVariantRow();
loadProducts();
</script>
</body>
</html>

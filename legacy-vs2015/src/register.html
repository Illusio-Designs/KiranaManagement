<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register store · KiranaManagement</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
<div class="container" style="max-width:640px">
  <div class="text-center mt-4 mb-3"><h3>🛒 Register your store</h3>
    <div class="text-muted">After you register, a Super Admin reviews and approves it. Then you can log in.</div></div>
  <div class="card"><div class="card-body">
    <div class="row g-2">
      <div class="col-md-6"><input id="name" class="form-control" placeholder="Store name *"></div>
      <div class="col-md-6"><input id="owner" class="form-control" placeholder="Owner name *"></div>
      <div class="col-md-6"><input id="email" class="form-control" placeholder="Email *"></div>
      <div class="col-md-6"><input id="phone" class="form-control" placeholder="Phone"></div>
      <div class="col-md-6"><input id="pass" type="password" class="form-control" placeholder="Password *"></div>
      <div class="col-md-6"><input id="city" class="form-control" placeholder="City"></div>
      <div class="col-md-6"><input id="gstin" class="form-control" placeholder="GSTIN (optional)"></div>
      <div class="col-md-6"><input id="pan" class="form-control" placeholder="PAN (optional)"></div>
    </div>
    <button class="btn btn-success mt-3 w-100" onclick="register()">Register</button>
    <div id="out" class="mt-2"></div>
    <hr>
    <div class="text-center">Already approved? <a href="login.html">Log in</a></div>
  </div></div>
</div>
<script>
function v(id){ return document.getElementById(id).value.trim(); }
async function register(){
  const out = document.getElementById('out');
  try{
    const res = await fetch('/api/stores/register', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ storeName:v('name'), ownerName:v('owner'), email:v('email'),
        phone:v('phone'), password:v('pass'), city:v('city'), gstin:v('gstin'), pan:v('pan') })
    });
    const data = await res.json();
    if(!res.ok) throw (data.error || 'Registration failed');
    out.innerHTML = '<div class="alert alert-success">Registered! Status: <b>'+data.status+
      '</b>. Please wait for Super Admin approval, then <a href="login.html">log in</a>.</div>';
  }catch(e){ out.innerHTML = '<div class="alert alert-danger py-2 mb-0">'+e+'</div>'; }
}
</script>
</body>
</html>
